[project]
name = "analizador-microscopia"
version = "0.1.0"
description = "Análisis de imágenes de microscopía MOKE, SEM y TEM"
readme = "README.md"
authors = [
    { name = "Mauricio Romano", email = "mauricio.romano@ib.edu.ar" },
    { name = "Daniel Romero", email = "daniel.romero@ib.edu.ar" },
    { name = "Ángel A. Pérez", email = "angel.perez@ib.edu.ar" },
]
requires-python = ">=3.14"

dependencies = [
    "exifread>=3.5.1",
    "matplotlib>=3.11.2",
    "mrcfile>=1.5.4",
    "ncempy>=1.17",
    "numpy>=2.5.4",
    "pywavelets>=1.10.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tifffile>=2026.11.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
